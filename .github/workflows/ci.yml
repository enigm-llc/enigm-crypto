name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run check
      - run: npm test
      - run: npm run examples
      - run: npm run benchmark
      - run: npm run test:runtime
      - run: npm run test:package
      - run: npm run release:check
      - run: npm run pack:verify
      - run: npm run --silent sbom > enigm-crypto.cdx.json
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enigm-crypto-sbom
          path: enigm-crypto.cdx.json
          if-no-files-found: error

  native:
    # The native engine must reproduce the JavaScript engine on shared vectors.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: mkdir -p native/target && node --import tsx native/vectors/generate.ts > native/target/vectors.json
      - run: cargo +1.99.0 test --manifest-path native/Cargo.toml --release --locked
