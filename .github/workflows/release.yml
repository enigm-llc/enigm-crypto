name: Release provenance

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run check
      - run: npm test
      - run: npm run examples
      - run: npm run benchmark
      - run: npm run pack:verify
      - run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          npm run --silent sbom > release/enigm-crypto.cdx.json
          sha256sum release/* > release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enigm-crypto-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enigm-crypto-release
          path: release
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*.tgz
      - uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-path: release/*.tgz
          sbom-path: release/enigm-crypto.cdx.json
      - run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
