name: Bug report
description: Report a reproducible non-security defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include keys, credentials, user data or suspected vulnerabilities. Use the private security reporting link for security issues.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: 0.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and include a minimal, non-sensitive reproducer.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, operating system and relevant package versions.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This report does not describe a suspected security vulnerability or contain sensitive data.
          required: true
